<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dream Reveal Letter</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app public-app" aria-live="polite">
      <section class="screen loader-screen is-active" id="loader" data-screen="loader">
        <div class="loader-card">
          <p class="loader-icon">💌</p>
          <h1>Someone left you something special...</h1>
        </div>
      </section>

      <section class="screen error-screen" data-screen="error" aria-hidden="true">
        <div class="loader-card">
          <p class="loader-icon">💔</p>
          <h1 id="errorTitle">Reveal not found</h1>
          <p id="errorMessage">This surprise link is unavailable.</p>
        </div>
      </section>

      <section class="screen letter-screen" data-screen="letter" aria-hidden="true">
        <div class="letter-card" aria-label="Romantic handwritten letter">
          <img class="letter-reference" src="/assets/letter-bg.jpg" alt="A romantic handwritten love letter reference" />
          <div class="letter-glow"></div>
          <article class="generated-letter">
            <div class="letter-art top-left">❤</div>
            <div class="letter-art top-right">☾ ✦</div>
            <h1 id="letterName">My Love</h1>
            <div class="letter-rule"></div>
            <div class="letter-message" id="letterMessage"></div>
          </article>
        </div>

        <button class="future-button" id="startButton" type="button">
          <span>💫</span>
          <span>Wanna see your future?</span>
        </button>
      </section>

      <section class="screen countdown-screen" data-screen="countdown" aria-hidden="true">
        <div class="countdown-shell">
          <p class="countdown-kicker">Your dream is almost here</p>
          <div class="countdown-number" id="countdownNumber">5</div>
        </div>
      </section>

      <section class="screen scratch-screen" data-screen="scratch" aria-hidden="true">
        <div class="scratch-copy soft-enter">
          <p class="eyebrow">Dream Reveal</p>
          <h1>Uncover the future you were always meant for</h1>
        </div>

        <div class="scratch-card soft-enter" id="scratchCard">
          <img alt="Dream future reveal" id="dreamImage" loading="lazy" />
          <canvas id="scratchCanvas" aria-label="Scratch card layer"></canvas>
          <div class="scratch-shine" aria-hidden="true"></div>
        </div>
      </section>

      <section class="screen final-screen" data-screen="final" aria-hidden="true">
        <div class="final-backdrop"></div>
        <div class="final-message">
          <p class="typed-line" data-text="I knew you would make it."></p>
          <p class="typed-line" data-text="This is only the beginning."></p>
          <p class="typed-line" data-text="I’m so proud of you."></p>
          <p class="typed-line" data-text="I’ll always be with you ❤️"></p>
        </div>
        <button class="share-button" type="button" onclick="shareReveal()">Share this surprise 💌</button>
      </section>
    </main>

    <audio id="bgMusic" preload="none" loop></audio>
    <script src="/script.js"></script>
  </body>
</html>
